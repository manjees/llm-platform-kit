[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-platform-kit"
version = "0.1.0"
description = "Production-ready LLM platform building blocks — observability, prompts, eval, RAG, hallucination guards"
readme = "README.md"
license = "MIT"
authors = [{ name = "manjee", email = "manjee.official@gmail.com" }]
requires-python = ">=3.11"
keywords = ["llm", "openai", "langfuse", "rag", "chroma", "eval", "platform", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
observability = ["langfuse>=2.60.0,<3.0"]
rag = ["chromadb>=0.5.0"]
all = [
    "langfuse>=2.60.0,<3.0",
    "chromadb>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/cl3-myloveidol/llm-platform-kit"
Issues = "https://github.com/cl3-myloveidol/llm-platform-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["llm_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
